name: Build Web e APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Gerar estrutura do projeto Flutter (sem sobrescrever lib/)
        run: |
          cp -r lib /tmp/lib_backup
          flutter create . --project-name edit_doc_flutter
          rm -rf lib
          cp -r /tmp/lib_backup lib
          flutter pub add shared_preferences

      - name: Analisar codigo
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Web
        run: flutter build web --release --base-href "/edit-doc-flutter/"

      - name: Publicar no GitHub Pages (branch gh-pages)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          publish_branch: gh-pages

      - name: Ajustar memoria do Gradle
        run: |
          sed -i 's/-Xmx[0-9]*[gGmM]/-Xmx1536m/g' android/gradle.properties
          echo "org.gradle.daemon=false" >> android/gradle.properties

      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
